<title>Extrusion Board Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: control-room console. Scenario rail | board diagram + agent lanes + transcript | engine column. */
:root{
  --bg:#E9ECEF; --panel:#F7F8F9; --panel2:#EEF1F3; --ink:#141C24; --muted:#5A6672; --line:#CDD3D9; --line2:#DCE1E6;
  --accent:#2550C0; --accent-ink:#FFFFFF;
  --ok:#1D7A4C; --ok-bg:#E1F2E8; --bad:#B8322A; --bad-bg:#F8E3E1; --warn:#9A6A00; --warn-bg:#F8EFD6; --info:#3B5B86; --info-bg:#E3EAF3;
  --tech:#2F67B1; --legal:#7547B0; --fin:#167D66; --ops:#A35A1A; --hr:#B03A66; --exec:#141C24;
  --term-bg:#18212A; --term-ink:#D6E0E8; --term-dim:#8899A8; --term-ok:#7FD1A4; --term-bad:#F09189;
  --shadow:0 1px 0 rgba(20,28,36,.04),0 6px 18px -10px rgba(20,28,36,.18);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --panel:#151C22; --panel2:#1A222A; --ink:#E4EAEF; --muted:#93A1AE; --line:#2A353F; --line2:#222C35;
  --accent:#7598F2; --accent-ink:#0E1318;
  --ok:#5FC290; --ok-bg:#16301F; --bad:#F0857B; --bad-bg:#3A1A18; --warn:#E3B54A; --warn-bg:#352A10; --info:#8FB0DA; --info-bg:#1A2737;
  --tech:#76A6E8; --legal:#B48DEB; --fin:#5CC7AB; --ops:#E09A5A; --hr:#E8829F; --exec:#E4EAEF;
  --term-bg:#0A0F13; --term-ink:#D6E0E8; --term-dim:#7D8C99; --term-ok:#7FD1A4; --term-bad:#F09189;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --panel:#151C22; --panel2:#1A222A; --ink:#E4EAEF; --muted:#93A1AE; --line:#2A353F; --line2:#222C35;
  --accent:#7598F2; --accent-ink:#0E1318;
  --ok:#5FC290; --ok-bg:#16301F; --bad:#F0857B; --bad-bg:#3A1A18; --warn:#E3B54A; --warn-bg:#352A10; --info:#8FB0DA; --info-bg:#1A2737;
  --tech:#76A6E8; --legal:#B48DEB; --fin:#5CC7AB; --ops:#E09A5A; --hr:#E8829F; --exec:#E4EAEF;
  --term-bg:#0A0F13; --term-ink:#D6E0E8; --term-dim:#7D8C99; --term-ok:#7FD1A4; --term-bad:#F09189;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;line-height:1.7}
.mono{font-family:var(--f-mono)}
.tabnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;margin:0;line-height:1}
.brand .ar{font-size:14px;color:var(--muted)}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);white-space:nowrap}
.controls{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 9px;font-family:var(--f-mono);font-size:12px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.progress{height:4px;background:var(--line2);position:relative}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .25s}
.notice{font-size:12px;color:var(--muted);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line2);background:var(--panel2)}

/* grid */
.grid{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;gap:16px;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
@media (max-width:1240px){.grid{grid-template-columns:minmax(0,1fr) 340px}.col-left{grid-column:1 / -1}}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.panel-h h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em}
.panel-b{padding:12px 14px}

/* scenarios */
.scen-list{display:flex;flex-direction:column;gap:6px}
@media (max-width:1240px){.scen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.scen{text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:9px 11px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.scen:hover{border-color:var(--muted)}
.scen[aria-current="true"]{border-color:var(--accent);background:var(--info-bg)}
.scen .g{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;grid-row:span 3;color:var(--muted);padding-top:2px;min-width:26px}
.scen[aria-current="true"] .g{color:var(--accent)}
.scen .t{font-weight:600;font-size:13px;line-height:1.3}
.scen .ta{font-family:var(--f-ar);font-size:12px;color:var(--muted);direction:rtl;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}

/* gate rail */
.rail{display:flex;flex-direction:column;gap:0}
.rail-row{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;position:relative;padding:5px 0}
.rail-row::before{content:"";position:absolute;left:17px;top:-4px;bottom:-4px;width:2px;background:var(--line)}
.rail-row:first-child::before{top:50%}.rail-row:last-child::before{bottom:50%}
.gnode{position:relative;z-index:1;width:36px;height:24px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--panel)}
.gnode.passed{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.gnode.current{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.gnode.locked{color:var(--muted)}
.rail-row .nm{font-size:12px;line-height:1.25}
.rail-row .nm .ar{font-size:11.5px;color:var(--muted);text-align:left;direction:rtl;display:block}

/* board diagram */
.board svg{display:block;width:100%;height:auto;max-width:100%}
.board text{font-family:var(--f-body)}
.spoke{stroke:var(--line);stroke-width:1.5;fill:none}
.spoke.active{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6;animation:flow 0.9s linear infinite}
.spoke.up{animation-direction:reverse}
.spoke.ok{stroke:var(--ok);stroke-dasharray:none}.spoke.bad{stroke:var(--bad);stroke-dasharray:none}.spoke.warn{stroke:var(--warn);stroke-dasharray:none}
@keyframes flow{to{stroke-dashoffset:-24}}
.node-ring{fill:var(--panel);stroke-width:2}
.node-busy{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.blocker{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:3 4;fill:none;opacity:.55}

/* agent lanes */
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1500px){.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{border:1px solid var(--line2);border-radius:7px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s,opacity .2s}
.lane.idle{opacity:.6}
.lane.busy{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.lane-h{display:flex;align-items:center;gap:8px}
.mono-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.03em;color:var(--panel);background:var(--c);flex:none}
.lane-h .n{font-weight:600;font-size:12.5px;line-height:1.2}
.lane-h .ar{font-size:11.5px;color:var(--muted);text-align:left}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.reading,.pill.analyzing{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.pill.reading .dot,.pill.analyzing .dot{animation:pulse 1s infinite}
.pill.APPROVED{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.VETOED{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.NEEDS_INFO{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.pill.STALE{color:var(--warn);background:var(--warn-bg);border-color:transparent;text-decoration:line-through}
.subject{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.thought{font-size:12.5px;min-height:3.2em;color:var(--ink)}
.thought .cursor{display:inline-block;width:6px;height:13px;background:var(--c);vertical-align:-2px;margin-left:2px;animation:pulse .8s infinite}
.finds{display:flex;flex-direction:column;gap:4px}
.find{display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:11.5px;align-items:start}
.sev{font-family:var(--f-mono);font-size:9.5px;font-weight:500;padding:1px 4px;border-radius:3px;line-height:1.4}
.sev.CRITICAL{background:var(--bad);color:var(--panel)}.sev.HIGH{background:var(--bad-bg);color:var(--bad)}
.sev.MEDIUM{background:var(--warn-bg);color:var(--warn)}.sev.LOW{background:var(--panel2);color:var(--muted)}
.find code{font-family:var(--f-mono);font-size:10.5px;overflow-wrap:anywhere}

/* transcript */
.feed{max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.row{display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:8px;padding:6px 4px;border-radius:5px;align-items:start}
.row.fresh{animation:fadein .35s ease-out}
@keyframes fadein{from{background:var(--info-bg)}to{background:transparent}}
.row .ts{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:3px}
.who{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:10px;color:var(--panel);background:var(--c,var(--muted))}
.row .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.row .body p{margin:0}
.row .body .ar{font-size:13px;color:var(--muted)}
.term{background:var(--term-bg);color:var(--term-ink);font-family:var(--f-mono);font-size:11.5px;border-radius:5px;padding:8px 10px;overflow-x:auto;white-space:pre;line-height:1.55}
.term .p{color:var(--term-dim)}.term .okc{color:var(--term-ok)}.term .badc{color:var(--term-bad)}
.trigger{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--panel2);display:flex;flex-direction:column;gap:3px}
.trigger .ch{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.trigger .tt{font-weight:600}
.trigger .file{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kv div{border:1px solid var(--line2);border-radius:5px;padding:5px 8px;background:var(--panel)}
.kv b{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500}
.kv span{font-size:10.5px;color:var(--muted)}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warnline{color:var(--warn);font-weight:500}

/* engine column */
.cond{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line2)}
.cond:last-child{border-bottom:0}
.ci{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ci.ok{background:var(--ok);color:var(--panel)}.ci.fail{background:var(--bad);color:var(--panel)}.ci.wait{border:1.5px solid var(--muted);color:var(--muted)}
.cond .note{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.gate-state{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;padding:2px 8px;border-radius:4px}
.gate-state.BLOCKED{background:var(--bad-bg);color:var(--bad)}.gate-state.READY{background:var(--ok-bg);color:var(--ok)}.gate-state.PASSED{background:var(--ok);color:var(--panel)}
.stamp{border:2px solid currentColor;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.stamp.allow{color:var(--ok);background:var(--ok-bg)}.stamp.deny{color:var(--bad);background:var(--bad-bg)}
.stamp .big{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.08em;line-height:1}
.stamp .act{font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.stamp ul{margin:0;padding-left:16px;color:var(--ink);font-size:12px}
.chain{display:flex;flex-direction:column;gap:0}
.blk{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 0;position:relative;font-size:12px}
.blk::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:1.5px;background:var(--line)}
.blk .sq{position:relative;z-index:1;width:40px;font-family:var(--f-mono);font-size:10.5px;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:2px 0;align-self:start}
.blk .ty{font-family:var(--f-mono);font-size:11px;font-weight:500}
.blk .lb{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.blk .hs{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.blk.bad .sq{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.blk.bad .ty,.blk.bad .hs{color:var(--bad)}
.blk.new .sq{border-color:var(--accent);color:var(--accent)}
.vote{border:2px solid var(--accent);border-radius:8px;background:var(--info-bg)}
.vote .panel-h{border-bottom-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.member{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--accent) 15%,transparent)}
.member:last-child{border-bottom:0}
.member .r{font-size:12.5px;font-weight:500}.member .r .ar{font-size:11.5px;color:var(--muted);text-align:left;display:block}
.member .req{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.vbtn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 9px;font-size:12px;min-height:30px}
.vbtn.ap:hover{border-color:var(--ok);color:var(--ok)}.vbtn.rj:hover{border-color:var(--bad);color:var(--bad)}
.voted{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px}
.voted.APPROVE{background:var(--ok-bg);color:var(--ok)}.voted.REJECT{background:var(--bad-bg);color:var(--bad)}
.pin{display:inline-flex;gap:4px}.pin i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pin .7s steps(1) forwards;opacity:0}
.pin i:nth-child(2){animation-delay:.08s}.pin i:nth-child(3){animation-delay:.16s}.pin i:nth-child(4){animation-delay:.24s}.pin i:nth-child(5){animation-delay:.32s}.pin i:nth-child(6){animation-delay:.4s}
@keyframes pin{to{opacity:1}}
.draft{border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.draft-h{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 9px;background:var(--panel2);font-size:11.5px}
.draft-h b{font-weight:600}
.draft pre{margin:0;padding:8px 9px;font-family:var(--f-body);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.draft .ar{padding:0 9px 8px;font-size:12.5px}
.draft .ft{font-family:var(--f-mono);font-size:10px;color:var(--muted);padding:0 9px 7px}

/* packet */
.packet{border:1px solid var(--ink);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}
.packet-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--ink)}
.packet-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em}
.packet-b{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.packet-b{grid-template-columns:minmax(0,1fr)}}
.packet-b section{display:flex;flex-direction:column;gap:6px;min-width:0}
.packet-b h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hard{grid-column:1 / -1;border-left:4px solid var(--bad);padding:8px 12px;background:var(--bad-bg);border-radius:0 6px 6px 0;display:grid;gap:4px}
.hard p{margin:0}.hard .ar{font-size:15px;font-weight:500}
.packet table{width:100%;border-collapse:collapse;font-size:12px}
.packet td,.packet th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.packet th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cmds{grid-column:1 / -1}
.cmds ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.howto{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.howto div{font-size:12px;color:var(--muted)}
.howto b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink);font-weight:600;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function sha256(str){
  const msg = new TextEncoder().encode(str), l = msg.length, n = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(n); buf.set(msg); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let i = 0; i < n; i += 64){
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++){
      const s0 = r(W[t-15],7) ^ r(W[t-15],18) ^ (W[t-15] >>> 3), s1 = r(W[t-2],17) ^ r(W[t-2],19) ^ (W[t-2] >>> 10);
      W[t] = (W[t-16] + s0 + W[t-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let t = 0; t < 64; t++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K256[t] + W[t]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = H.map((x, k) => (x + [a,b,c,d,e,f,g,h][k]) >>> 0);
  }
  return H.map(x => x.toString(16).padStart(8, "0")).join("");
}

const DUR = { trigger:1900, say:1700, cmd:1600, dispatch:1400, calc:1900, find:1500, verdict:1700, event:800, gate:1700, auth:1700, draft:1600, stale:1900, tamper:1900, untamper:900, packet:900, human:600, options:1900, journal:1500, journal_dup:1500 };
const DT = { trigger:60, say:25, cmd:4, dispatch:6, calc:30, find:45, verdict:20, event:2, gate:3, auth:3, draft:40, stale:2, tamper:2, untamper:2, packet:30, human:240, options:20, journal:600, journal_dup:5 };

function expandSteps(sc, decisions){
  const out = [];
  for (let i = 0; i < sc.steps.length; i++){
    out.push(sc.steps[i]);
    const d = decisions[i];
    if (sc.steps[i].t === "human" && d && d.rejected && sc.onReject){ return out.concat(sc.onReject); }
  }
  return out;
}

function quorumMet(step, votes){
  const appr = Object.keys(votes).filter(r => votes[r] === "APPROVE");
  return appr.length >= step.quorum && step.required.every(r => appr.includes(r));
}

/* ---------------------------------------------------------------- replay: state = fold(steps[0..idx)) */
function initialState(sc){
  const hist = sc.history || [];
  const base = sc.seq - 1 - hist.length;
  const s0 = { events:[{ seq: base, type: "…", label: `${base} earlier events`, hash: sha256("anchor:" + sc.id), prior:true }] };
  hist.forEach(([type, label]) => addEvent(s0, type, label));
  const events = s0.events;
  return { log:[], agents:Object.fromEntries(AG_KEYS.map(k => [k,{ status:"idle", thought:"", findings:[], verdict:null, subject:null, stale:false }])),
    events, gate:null, action:null, human:null, drafts:[], packet:null, options:null, broken:false,
    clock: new Date(sc.start + "Z").getTime(), active:new Set(), returning:{} };
}
function addEvent(s, type, label, payload){
  const prev = s.events[s.events.length - 1];
  const seq = prev.seq + 1;
  const body = JSON.stringify({ seq, type, label, payload: payload || null, prev: prev.hash });
  s.events = s.events.concat({ seq, type, label, hash: sha256(body), prev: prev.hash });
  return seq;
}
function apply(s, step, i, decisions){
  s.clock += (step.dt || DT[step.t] || 10) * 1000;
  const ts = s.clock;
  const L = (o) => { s.log = s.log.concat({ ...o, ts, i }); };
  switch (step.t){
    case "trigger": L({ kind:"trigger", who:"human", step }); break;
    case "say": {
      L({ kind:"say", who:step.who, en:step.en, ar:step.ar });
      if (AGENTS[step.who]){ const a = s.agents[step.who]; s.agents = { ...s.agents, [step.who]:{ ...a, thought:step.en, status: step.phase || (a.status === "reading" ? "analyzing" : a.status === "idle" ? "analyzing" : a.status) } }; s.active = new Set([...s.active, step.who]); }
      break; }
    case "cmd": L({ kind:"cmd", who:"exec", cmd:step.cmd, out:step.out, ok:step.ok }); break;
    case "dispatch": {
      const ag = { ...s.agents };
      step.to.forEach(k => { ag[k] = { status:"reading", thought:"Received task. Gate " + step.gate + ".", findings:[], verdict:null, subject:step.subjects[k], stale:false }; });
      s.agents = ag; s.active = new Set(step.to); s.returning = {};
      L({ kind:"dispatch", who:"exec", step }); break; }
    case "calc": {
      const a = s.agents[step.who]; s.agents = { ...s.agents, [step.who]:{ ...a, status:"analyzing", thought:"Running calculator: " + step.cmd.split(" ")[0] } };
      L({ kind:"calc", who:step.who, step }); break; }
    case "find": {
      const a = s.agents[step.who];
      s.agents = { ...s.agents, [step.who]:{ ...a, status:"analyzing", findings:a.findings.concat({ sev:step.sev, code:step.code, en:step.en, ref:step.ref }) } };
      L({ kind:"find", who:step.who, step }); break; }
    case "verdict": {
      const a = s.agents[step.who];
      s.agents = { ...s.agents, [step.who]:{ ...a, status:"done", verdict:step.status, thought:step.en, stale:false } };
      const seq = addEvent(s, "VERDICT", `${AGENTS[step.who].id}/${step.gate}/${step.subject} = ${step.status}`);
      s.returning = { ...s.returning, [step.who]: step.status };
      L({ kind:"verdict", who:step.who, step, seq }); break; }
    case "event": { const seq = addEvent(s, step.type, step.label); L({ kind:"event", who:"engine", step, seq }); break; }
    case "gate": { s.gate = { gate:step.gate, conds:step.conds }; L({ kind:"gate", who:"engine", step }); break; }
    case "auth": {
      const seq = addEvent(s, step.ok ? "ACTION_AUTHORIZED" : "ACTION_DENIED", `${step.action}${step.ref ? " ref=" + step.ref : ""}`);
      s.action = { ...step, seq }; L({ kind:"auth", who:"engine", step, seq }); break; }
    case "draft": s.drafts = [{ ...step, ts }].concat(s.drafts); L({ kind:"draft", who:"exec", step }); break;
    case "stale": {
      const ag = { ...s.agents }; step.agents.forEach(k => { ag[k] = { ...ag[k], stale:true, status:"stale" }; });
      s.agents = ag; s.returning = {}; L({ kind:"stale", who:"engine", step }); break; }
    case "tamper": {
      s.broken = true;
      s.events = s.events.map(e => e.seq === step.seq ? { ...e, bad:true, type:"ACTION_AUTHORIZED", label:"pour_foundations (edited)" } : e.seq === step.seq + 1 ? { ...e, bad:true, label:e.label + " · prev_hash broken" } : e);
      L({ kind:"tamper", who:"engine", step }); break; }
    case "untamper": {
      s.broken = false;
      s.events = s.events.map(e => e.seq === step.seq ? { ...e, bad:false, type:"ACTION_DENIED", label:"pour_foundations (restored)" } : e.seq === step.seq + 1 ? { ...e, bad:false, label:e.label.replace(" · prev_hash broken","") } : e);
      break; }
    case "human": {
      const d = decisions[i] || { votes:{} };
      s.human = { ...step, i, votes:d.votes || {}, done:!!d.done, rejected:!!d.rejected };
      L({ kind:"human", who:"human", step });
      if (d.done){
        if (step.mode === "action"){ L({ kind:"humanDone", who:"human", text:`${ROLES[step.role].en} ran: ${step.command}` }); }
        else {
          Object.entries(d.votes).forEach(([role, v]) => { const seq = addEvent(s, "APPROVAL", `${step.key} · ${v} · ${ROLES[role].en}`); L({ kind:"vote", who:"human", role, v, key:step.key, seq }); });
        }
        s.human = { ...s.human, done:true };
      }
      break; }
    case "options": s.options = step.rows; L({ kind:"options", who:"exec", step }); break;
    case "journal": { const seq = addEvent(s, "JOURNAL_ENTRY", `${step.entry} · auth seq ${s.action ? s.action.seq : "?"}`); L({ kind:"cmd", who:"exec", cmd:`python3 engine/board.py journal-add --entry-type PAYMENT --classification ADVANCE_TO_SUPPLIER --amount 690000 --currency EUR --fx-rate-to-usd 1.08 --gate OPS --ref M2 --auth-seq ${s.action ? s.action.seq : "?"}`, out:[`JOURNAL ${step.entry} ADVANCE_TO_SUPPLIER 690000 EUR (USD 745200.00) hash ${sha256(step.entry).slice(0,12)}`], ok:true }); break; }
    case "journal_dup": L({ kind:"cmd", who:"exec", cmd:`python3 engine/board.py journal-add --entry-type PAYMENT … --auth-seq ${s.action ? s.action.seq : "?"}`, out:[`REFUSED: Authorization ${s.action ? s.action.seq : "?"} already consumed by a PAYMENT entry`], ok:false }); break;
    case "packet": s.packet = step; s.active = new Set(); L({ kind:"packet", who:"exec", step }); break;
  }
}
function replay(sc, steps, idx, decisions){
  const s = initialState(sc);
  for (let i = 0; i < idx && i < steps.length; i++) apply(s, steps[i], i, decisions);
  return s;
}

/* ---------------------------------------------------------------- small components */
const fmtTime = ms => new Date(ms).toISOString().slice(11,16);
const fmtClock = ms => new Date(ms).toISOString().slice(0,16).replace("T"," ");
const reduced = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } };

function Typer({ text, c }){
  const [n, setN] = useState(text ? text.length : 0);
  useEffect(() => {
    if (!text || reduced()){ setN(text ? text.length : 0); return; }
    setN(0); let k = 0;
    const id = setInterval(() => { k += 3; setN(k); if (k >= text.length) clearInterval(id); }, 16);
    return () => clearInterval(id);
  }, [text]);
  const typing = text && n < text.length;
  return html`<div className="thought" style=${{ "--c":c }}>${text ? text.slice(0, n) : html`<span className="muted">Idle. Waiting for a task from Board_Exec.</span>`}${typing && html`<span className="cursor"></span>`}</div>`;
}

function Pill({ status }){
  const label = { idle:"Idle", reading:"Reading", analyzing:"Analyzing", done:"Done", stale:"Stale" }[status] || status;
  return html`<span className=${"pill " + status}><span className="dot"></span>${label}</span>`;
}

function Who({ k }){ const w = WHO[k] || WHO.exec; return html`<span className="who" style=${{ "--c":w.c }} title=${w.en}>${w.code}</span>`; }

/* ---------------------------------------------------------------- transcript row */
function Row({ e, fresh }){
  const body = (() => { switch (e.kind){
    case "trigger": { const s = e.step; return html`<div className="trigger"><span className="ch">${s.ch} · ${s.from}</span><span className="tt">${s.title}</span>${s.body_ar && html`<p className="ar">${s.body_ar}</p>`}<span className="muted">${s.body}</span>${s.file && html`<span className="file">${s.file}</span>`}</div>`; }
    case "say": return html`<p>${e.en}</p>${e.ar && html`<p className="ar">${e.ar}</p>`}`;
    case "cmd": return html`<div className="term"><span className="p">$ </span>${e.cmd}${"\n"}${e.out.map((l, j) => html`<span key=${j} className=${/REFUSED|TAMPER|DENY|CRITICAL/.test(l) ? "badc" : /OK|ALLOW|PASSED|JOURNAL/.test(l) ? "okc" : ""}>${l}${"\n"}</span>`)}</div>`;
    case "dispatch": { const s = e.step; return html`<p><b>Dispatch in parallel</b> · gate ${s.gate}</p><div className="vrow">${s.to.map(k => html`<span key=${k} className="pill" style=${{ color:AGENTS[k].c, borderColor:"currentColor" }}>${AGENTS[k].code} · ${s.subjects[k]}</span>`)}</div><span className="subject">${s.files.join("  ·  ")}</span>`; }
    case "calc": return html`<p className="mono" style=${{ fontSize:"11.5px" }}>${e.step.cmd}</p><div className="kv">${e.step.out.map(([v, k]) => html`<div key=${k}><b>${v}</b><span>${k}</span></div>`)}</div>`;
    case "find": { const f = e.step; return html`<div className="find"><span className=${"sev " + f.sev}>${f.sev}</span><div><code>${f.code}</code> <span className="muted">${f.ref}</span><p>${f.en}</p></div></div>`; }
    case "verdict": { const v = e.step; return html`<div className="vrow"><span className=${"pill " + v.status}>${v.status}</span><span className="subject">${AGENTS[v.who].id}/${v.gate}/${v.subject}</span><span className="subject">event ${e.seq}</span></div><p>${v.en}</p><p className="ar">${v.ar}</p>${v.conds && html`<p className="warnline">Condition: ${v.conds.join("; ")}</p>`}`; }
    case "event": return html`<p className="mono" style=${{ fontSize:"12px" }}>event ${e.seq} · ${e.step.type} · ${e.step.label}</p>`;
    case "gate": return html`<p><b>Gate check ${e.step.gate}:</b> ${e.step.conds.filter(c => c[1] !== "ok").length} condition(s) unmet</p>`;
    case "auth": { const a = e.step; return html`<p><b className=${a.ok ? "" : ""} style=${{ color:a.ok ? "var(--ok)" : "var(--bad)" }}>${a.ok ? "ALLOW" : "DENY"}</b> <span className="mono">${a.action}${a.ref ? " --ref " + a.ref : ""}</span> <span className="subject">event ${e.seq}</span></p>${a.reasons.length > 0 && html`<span className="subject">${a.reasons.join(" · ")}</span>`}`; }
    case "draft": { const d = e.step; return html`<p><b>Draft queued</b> · ${d.ch} · kind=${d.kind} · to ${d.to}. Not sent: a human sends.</p>`; }
    case "stale": return html`<p className="warnline">Evidence changed: ${e.step.file}. ${e.step.agents.length} verdicts are now STALE and no longer count.</p>`;
    case "tamper": return html`<p style=${{ color:"var(--bad)", fontWeight:600 }}>Chain broken at event ${e.step.seq}: ${e.step.en}</p>`;
    case "human": return html`<p><b>Waiting for the board:</b> ${e.step.label}</p><p className="ar">${e.step.label_ar}</p>`;
    case "humanDone": return html`<p className="mono" style=${{ fontSize:"12px" }}>${e.text}</p>`;
    case "vote": return html`<p><span className=${"voted " + e.v}>${e.v}</span> ${ROLES[e.role].en} on <span className="mono">${e.key}</span> <span className="subject">event ${e.seq}</span></p>`;
    case "options": return html`<p><b>Options prepared for the board</b> (see packet)</p>`;
    case "packet": return html`<p><b>Decision packet written</b> · packets/${new Date(e.ts).toISOString().slice(0,10).replace(/-/g,"")}_${e.step.gate}_${e.step.subject.replace(/[:]/g,"-")}.md</p>`;
    default: return null; } })();
  return html`<div className=${"row" + (fresh ? " fresh" : "")}><span className="ts">${fmtTime(e.ts)}</span><${Who} k=${e.who} /><div className="body">${body}</div></div>`;
}

/* ---------------------------------------------------------------- vote panel */
function VotePanel({ h, onVote }){
  const [pin, setPin] = useState(null);
  if (h.mode === "action"){
    return html`<div className="vote panel"><div className="panel-h"><h2>Human action required</h2><span className="pill analyzing"><span className="dot"></span>Paused</span></div>
      <div className="panel-b" style=${{ display:"grid", gap:"8px" }}>
        <p style=${{ margin:0 }}>${h.label}</p><p className="ar" style=${{ margin:0 }}>${h.label_ar}</p>
        <div className="term">$ ${h.command}</div>
        ${h.done ? html`<span className="voted APPROVE">Done by ${ROLES[h.role].en}</span>` :
          html`<button className="btn primary" onClick=${() => onVote(h.i, h.role, "APPROVE")}>${h.button}</button>`}
      </div></div>`;
  }
  const appr = Object.values(h.votes).filter(v => v === "APPROVE").length;
  const vote = (role, v) => { if (v === "REJECT") return onVote(h.i, role, v); setPin(role); setTimeout(() => { setPin(null); onVote(h.i, role, v); }, reduced() ? 0 : 750); };
  return html`<div className="vote panel"><div className="panel-h"><h2>Board vote</h2>${h.done ? html`<span className=${"pill " + (h.rejected ? "VETOED" : "APPROVED")}>${h.rejected ? "Rejected" : "Quorum met"}</span>` : html`<span className="pill analyzing"><span className="dot"></span>Your turn</span>`}</div>
    <div className="panel-b" style=${{ display:"grid", gap:"6px" }}>
      <div><b>${h.label}</b><p className="ar" style=${{ margin:0 }}>${h.label_ar}</p></div>
      <span className="subject">approve ${h.key} · quorum ${h.quorum} · ${appr}/${h.quorum} · required: ${h.required.map(r => ROLES[r].en).join(", ")}</span>
      ${!h.done && html`<p className="muted" style=${{ margin:"2px 0", fontSize:"12px" }}>You play each member. In the real system each person runs the approve command in their own terminal and types a PIN. One REJECT blocks.</p>`}
      <div>${h.eligible.map(role => html`<div className="member" key=${role}>
        <span className="r">${ROLES[role].en}${h.required.includes(role) && html` <span className="req">required</span>`}<span className="ar">${ROLES[role].ar}</span></span>
        ${h.votes[role] ? html`<span className=${"voted " + h.votes[role]}>${h.votes[role]}</span><span></span>` :
          pin === role ? html`<span className="pin" aria-label="Entering PIN"><i></i><i></i><i></i><i></i><i></i><i></i></span><span></span>` :
          h.done ? html`<span className="muted" style=${{ fontSize:"11px" }}>not needed</span><span></span>` :
          html`<button className="vbtn ap" onClick=${() => vote(role, "APPROVE")}>Approve</button><button className="vbtn rj" onClick=${() => vote(role, "REJECT")}>Reject</button>`}
      </div>`)}</div>
    </div></div>`;
}

/* ---------------------------------------------------------------- packet */
function Packet({ p, st, sc }){
  const verdicts = AG_KEYS.filter(k => st.agents[k].verdict).map(k => [k, st.agents[k]]);

    <div className="packet-h"><div><span className="label">Decision packet · حزمة القرار</span><h2>${sc.title}</h2><p className="ar" style=${{ margin:0, color:"var(--muted)" }}>${sc.title_ar}</p></div>
      <div className="vrow"><span className="pill">${p.gate} · ${p.subject}</span>${p.rejected ? html`<span className="pill VETOED">Blocked by vote</span>` : st.action ? html`<span className=${"pill " + (st.action.ok ? "APPROVED" : "VETOED")}>${st.action.ok ? "Action allowed" : "Action denied"}</span>` : null}<span className="subject">chain head ${st.events[st.events.length - 1].hash.slice(0,12)}</span></div></div>
    <div className="packet-b">
      <div className="hard"><span className="label" style=${{ color:"var(--bad)" }}>Hard truth · الحقيقة الصعبة</span><p className="ar">${p.hard_ar}</p><p>${p.hard_en}</p></div>
      <section><h3>القرار</h3><p className="ar" style=${{ margin:0 }}>${p.dec_ar}</p></section>

      <section style=${{ gridColumn:"1 / -1" }}><h3>Agent verdicts · أحكام الوكلاء</h3>
        <div style=${{ overflowX:"auto" }}><table><thead><tr><th>Agent</th><th>Status</th><th>Key findings</th></tr></thead><tbody>
          ${verdicts.length ? verdicts.map(([k, a]) => html`<tr key=${k}><td><b>${AGENTS[k].en}</b><br/><span className="subject">${a.subject}</span></td><td><span className=${"pill " + (a.stale ? "STALE" : a.verdict)}>${a.stale ? "STALE" : a.verdict}</span></td><td>${a.findings.length ? a.findings.map((f, j) => html`<div key=${j}><span className=${"sev " + f.sev}>${f.sev}</span> <code style=${{ fontSize:"11px" }}>${f.code}</code></div>`) : html`<span className="muted">None</span>`}</td></tr>`)
          : html`<tr><td colSpan="3" className="muted">No agents dispatched. Integrity checks come before reviews.</td></tr>`}
        </tbody></table></div></section>
      ${st.options && html`<section style=${{ gridColumn:"1 / -1" }}><h3>Options for the board · الخيارات</h3><div style=${{ overflowX:"auto" }}><table><thead><tr><th></th><th>Option</th><th>Cost</th><th>Risk</th><th>Agents</th></tr></thead><tbody>${st.options.map(r => html`<tr key=${r[0]}>${r.map((c, j) => html`<td key=${j}>${j === 0 ? html`<b>${c}</b>` : c}</td>`)}</tr>`)}</tbody></table></div></section>`}
      <section style=${{ gridColumn:"1 / -1" }}><h3>Cross track risk · مخاطر المسارين</h3><p style=${{ margin:0 }}>${p.risk}</p></section>
      <section className="cmds"><h3>Required next actions · المطلوب</h3><ol>${p.next.map((n, j) => html`<li key=${j}>${n}</li>`)}</ol></section>
    </div></article>`;
}

/* ---------------------------------------------------------------- app */
function App(){
  const [sid, setSid] = useState("rfp");
  const [decisions, setDecisions] = useState({});
  const sc = BY_ID[sid];
  const steps = useMemo(() => expandSteps(sc, decisions), [sid, decisions]);
  const [idx, setIdx] = useState(() => BY_ID.rfp.steps.length);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);
  const st = useMemo(() => replay(sc, steps, idx, decisions), [sc, steps, idx, decisions]);
  const feedRef = useRef(null);

  const blocked = st.human && !st.human.done && idx > 0 && steps[idx - 1] && steps[idx - 1].t === "human";
  const finished = idx >= steps.length;

  useEffect(() => {
    if (!playing || finished || blocked) return;
    const next = steps[idx];
    const id = setTimeout(() => setIdx(i => i + 1), (DUR[next.t] || 1200) / speed);
    return () => clearTimeout(id);
  }, [playing, idx, steps, speed, finished, blocked]);
  useEffect(() => { if (finished) setPlaying(false); }, [finished]);
  useEffect(() => { const f = feedRef.current; if (f) f.scrollTop = f.scrollHeight; }, [st.log.length]);

  const choose = id => { setSid(id); setDecisions({}); setIdx(0); setPlaying(true); };
  const restart = () => { setDecisions({}); setIdx(0); setPlaying(true); };
  const onVote = (i, role, v) => setDecisions(d => {
    const step = steps[i]; const cur = d[i] || { votes:{} };
    if (step.mode === "action") return { ...d, [i]:{ votes:{ [role]:"APPROVE" }, done:true } };
    const votes = { ...cur.votes, [role]:v };
    const rejected = v === "REJECT";
    return { ...d, [i]:{ votes, rejected, done: rejected || quorumMet(step, votes) } };
  });
  useEffect(() => { if (st.human && st.human.done && blocked === false && !playing && !finished && idx > 0 && steps[idx - 1].t === "human") setPlaying(true); }, [st.human && st.human.done]);

  const passedRail = sc.passed;
  const statusLine = blocked ? "Paused: the board must vote" : finished ? "Scenario complete" : playing ? "Running" : "Paused";

  return html`<div>
    <header className="top">
      <div className="top-in">
        <div className="brand"><h1>Extrusion Board Room</h1><span className="ar">غرفة مجلس الإدارة · محاكاة الوكلاء</span></div>
        <span className="clock tabnum" title="Simulated clock, Asia/Damascus shown as UTC for the demo">${fmtClock(st.clock)}</span>
        <div className="controls">
          <span className="label" aria-live="polite">${statusLine}</span>
          <button className="btn" onClick=${restart} title="Restart scenario">↺ Replay</button>
          <button className="btn primary" onClick=${() => { if (finished) restart(); else setPlaying(p => !p); }} disabled=${blocked}>${playing && !finished ? "❚❚ Pause" : "▶ Play"}</button>
          <button className="btn" onClick=${() => { setPlaying(false); setIdx(i => Math.min(i + 1, steps.length)); }} disabled=${finished || blocked}>Step ›</button>
          <div className="seg" role="group" aria-label="Speed">${[1,2,4].map(v => html`<button key=${v} aria-pressed=${speed === v} onClick=${() => setSpeed(v)}>${v}×</button>`)}</div>
        </div>
      </div>
      <div className="progress"><i style=${{ width: (100 * Math.min(idx, steps.length) / steps.length) + "%" }}></i></div>
    </header>
    <div className="notice">Simulation with example data. Vendor, bank and figures are representative, not real. No agents, connectors or messages are called. Hashes are real SHA-256 over the simulated events.</div>

    <main className="grid">
      <aside className="col col-left">
        <section className="panel"><div className="panel-h"><h2>Scenarios</h2><span className="label">${SCENARIOS.length}</span></div>
          <div className="panel-b scen-list">${SCENARIOS.map(s => html`<button key=${s.id} className="scen" aria-current=${s.id === sid} onClick=${() => choose(s.id)}>
            <span className="g">${s.g}</span><span className="t">${s.title}</span><span className="ta">${s.title_ar}</span>
            <span className="tags">${s.tags.map(t => html`<span key=${t} className="tag">${t}</span>`)}</span></button>`)}</div></section>
        <section className="panel"><div className="panel-h"><h2>Gate rail</h2><span className="label">this scenario</span></div>
          <div className="panel-b rail">${GATES.map(([g, en, ar]) => {
            const cur = GATES.map(x => x[0]).find(x => !passedRail.includes(x));
            const cls = passedRail.includes(g) ? "passed" : g === cur ? "current" : "locked";
            return html`<div className="rail-row" key=${g}><span className=${"gnode " + cls}>${g}</span><span className="nm">${en}<span className="ar">${ar}</span></span></div>`; })}</div></section>
      </aside>

      <section className="col">
        <section className="panel board"><div className="panel-h"><h2>Board room · hub and spoke</h2><span className="label">${sc.g} · ${sc.title}</span></div>
          <div className="panel-b"><${BoardDiagram} st=${st} /></div></section>
        <section className="lanes">${AG_KEYS.map(k => { const a = st.agents[k], A = AGENTS[k];
          const busy = ["reading","analyzing"].includes(a.status);
          return html`<article key=${k} className=${"lane " + (a.status === "idle" ? "idle" : busy ? "busy" : "")} style=${{ "--c":A.c }}>
            <div className="lane-h"><span className="mono-badge">${A.code}</span><div style=${{ minWidth:0 }}><div className="n">${A.en}</div><div className="ar">${A.ar}</div></div></div>
            <div className="vrow">${a.verdict ? html`<span className=${"pill " + (a.stale ? "STALE" : a.verdict)}>${a.stale ? "STALE" : a.verdict}</span>` : html`<${Pill} status=${a.status} />`}${a.subject && html`<span className="subject">${a.subject}</span>`}</div>
            <${Typer} text=${a.thought} c=${A.c} />
            ${a.findings.length > 0 && html`<div className="finds">${a.findings.map((f, j) => html`<div className="find" key=${j}><span className=${"sev " + f.sev}>${f.sev.slice(0,4)}</span><code>${f.code}</code></div>`)}</div>`}
          </article>`; })}</section>
        ${st.packet && html`<${Packet} p=${st.packet} st=${st} sc=${sc} />`}
        <section className="panel"><div className="panel-h"><h2>Session transcript</h2><span className="label">${st.log.length} entries</span></div>
          <div className="panel-b feed" ref=${feedRef}>${st.log.length ? st.log.map((e, j) => html`<${Row} key=${j} e=${e} fresh=${j === st.log.length - 1} />`) : html`<p className="empty">Press Play. The first inbound document or message will appear here.</p>`}</div></section>
        <section className="panel"><div className="panel-b howto">
          <div><b>1 · Route</b>Board_Exec reads engine state and sends each subject to the agent that owns it.</div>
          <div><b>2 · Review</b>Agents work in isolation, read only, and return one verdict bound to file hashes.</div>
          <div><b>3 · Decide</b>The engine checks every gate condition. Agents cannot override it.</div>
          <div><b>4 · Approve</b>Humans vote with a PIN. Drafts wait for a human to send.</div>
        </div></section>
      </section>

      <aside className="col">
        ${st.human && html`<${VotePanel} h=${st.human} onVote=${onVote} />`}
        <section className="panel"><div className="panel-h"><h2>Gate check</h2>${st.gate && html`<span className=${"gate-state " + (st.gate.conds.every(c => c[1] === "ok") ? "READY" : "BLOCKED")}>${st.gate.gate} ${st.gate.conds.every(c => c[1] === "ok") ? "READY" : "BLOCKED"}</span>`}</div>
          <div className="panel-b">${st.gate ? st.gate.conds.map((c, j) => html`<div className="cond" key=${j}><span className=${"ci " + c[1]}>${c[1] === "ok" ? "✓" : c[1] === "fail" ? "✕" : ""}</span><div>${c[0]}${c[2] && html`<div className="note">${c[2]}</div>`}</div></div>`) : html`<p className="empty">No gate evaluated yet in this scenario.</p>`}</div></section>
        <section className="panel"><div className="panel-h"><h2>Controlled action</h2><span className="label">authorize</span></div>
          <div className="panel-b">${st.action ? html`<div className=${"stamp " + (st.action.ok ? "allow" : "deny")}><span className="big">${st.action.ok ? "ALLOW" : "DENY"}</span><span className="act">${st.action.action}${st.action.ref ? " --ref " + st.action.ref : ""} · event ${st.action.seq}</span>${st.action.reasons.length > 0 && html`<ul>${st.action.reasons.map((r, j) => html`<li key=${j}>${r}</li>`)}</ul>`}</div>` : html`<p className="empty">Nothing requested yet. Every outbound instruction is checked here first.</p>`}</div></section>
        <section className="panel"><div className="panel-h"><h2>Event chain</h2><span className=${"label"} style=${{ color: st.broken ? "var(--bad)" : "var(--ok)" }}>${st.broken ? "BROKEN" : "verified"}</span></div>
          <div className="panel-b chain">${st.events.slice(-9).map((e, j, arr) => html`<div key=${e.seq} className=${"blk" + (e.bad ? " bad" : "") + (j === arr.length - 1 && !e.prior ? " new" : "")}>
            <span className="sq">${e.prior ? "…" : e.seq}</span><div style=${{ minWidth:0 }}><div className="ty">${e.type}</div><div className="lb">${e.label}</div><div className="hs">${e.bad ? "hash mismatch" : e.hash.slice(0,16)}${!e.prior && !e.bad ? " ← " + e.prev.slice(0,6) : ""}</div></div></div>`)}</div></section>
        <section className="panel"><div className="panel-h"><h2>Outbox</h2><span className="label">drafts only</span></div>
          <div className="panel-b" style=${{ display:"grid", gap:"8px" }}>${st.drafts.length ? st.drafts.map((d, j) => html`<div className="draft" key=${j}>
            <div className="draft-h"><span><b>${d.ch}</b> · ${d.to}</span><span className="pill">DRAFT</span></div>
            ${d.subject && html`<div style=${{ padding:"6px 9px 0", fontWeight:600, fontSize:"12.5px" }}>${d.subject}</div>`}
            ${d.text_ar && html`<p className="ar" style=${{ margin:"6px 0 0" }}>${d.text_ar}</p>`}
            <pre>${d.text}</pre><div className="ft">[board:${d.kind}] · a human sends this</div></div>`) : html`<p className="empty">No drafts. Agents never send; they only queue drafts for a human.</p>`}</div></section>
      </aside>
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
